    <rect x="96" y="16" width="30" height="20" rx="2.5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <rect x="96" y="16" width="30" height="6" rx="2.5" fill="#14532d"/>
    <circle cx="100.5" cy="19" r="1" fill="#4ade80"/>
    <circle cx="104" cy="19" r="1" fill="#86efac"/>
    <text x="99" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="6.5" fill="#4ade80">$ curl</text>
  </g>

  <line x1="152" y1="10" x2="152" y2="46" stroke="#374151" stroke-width="1"/>

  <text x="166" y="35" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.02em">
    <tspan fill="#4ade80">Curl</tspan><tspan fill="#f9fafb">Drop</tspan>
  </text>
