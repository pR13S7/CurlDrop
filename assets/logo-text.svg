<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 56" fill="none" role="img" aria-label="CurlDrop">
  <rect width="460" height="56" fill="#111827"/>

  <g transform="translate(14, 8)">
    <!-- Network arcs -->
    <path d="M26 22c0-10 8-18 18-18s18 8 18 18" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16 22c0-14 12-26 26-26s26 12 26 26" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Browser -->
    <rect x="0" y="12" width="20" height="14" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <rect x="0" y="12" width="20" height="4" rx="2" fill="#334155"/>
    <circle cx="3.5" cy="14" r="0.8" fill="#ef4444"/>
    <circle cx="6.5" cy="14" r="0.8" fill="#eab308"/>
    <circle cx="9.5" cy="14" r="0.8" fill="#22c55e"/>
    <path d="M3 20h14" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M3 23h8" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Network link 1 -->
    <path d="M22 22h14" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.5 2.5"/>
    <path d="M32 22h6" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 19.5l4 2.5-4 2.5" fill="#3b82f6"/>

    <!-- Cloud / server -->
    <ellipse cx="54" cy="16" rx="12" ry="6" fill="#1e40af" opacity="0.35"/>
    <ellipse cx="47" cy="19" rx="9" ry="5" fill="#2563eb" opacity="0.55"/>
    <ellipse cx="59" cy="19" rx="9" ry="5" fill="#2563eb" opacity="0.55"/>
    <rect x="42" y="19" width="24" height="6" fill="#2563eb" opacity="0.55"/>

    <!-- File -->
    <path d="M50 24h9l3.5 3.5v10a1.2 1.2 0 0 1-1.2 1.2H50a1.2 1.2 0 0 1-1.2-1.2V25.2A1.2 1.2 0 0 1 50 24z" fill="#3b82f6"/>
    <path d="M59 24v3.5h3.5" fill="#2563eb"/>

    <!-- Network link 2 -->
    <path d="M72 28h14" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.5 2.5"/>
    <path d="M82 28h6" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M86 25.5l4 2.5-4 2.5" fill="#22c55e"/>

