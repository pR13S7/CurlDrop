<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 88" fill="none" role="img" aria-label="File Share">
  <rect width="520" height="88" rx="12" fill="#111827"/>

  <g transform="translate(18, 14)">
    <!-- Network arcs -->
    <path d="M30 30c0-12 10-22 22-22s22 10 22 22" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M18 30c0-18 14-32 32-32s32 14 32 32" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Upload / browser -->
    <rect x="0" y="18" width="22" height="16" rx="2.5" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="18" width="22" height="5" rx="2.5" fill="#334155"/>
    <circle cx="4" cy="20.5" r="1" fill="#ef4444"/>
    <circle cx="7" cy="20.5" r="1" fill="#eab308"/>
    <circle cx="10" cy="20.5" r="1" fill="#22c55e"/>
    <path d="M4 28h14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4 31h9" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Network link 1 -->
    <path d="M24 30h18" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M38 30h8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M44 27l5 3-5 3" fill="#3b82f6"/>

    <!-- Server / cloud node -->
    <ellipse cx="62" cy="22" rx="14" ry="7" fill="#1e40af" opacity="0.35"/>
    <ellipse cx="54" cy="26" rx="10" ry="6" fill="#2563eb" opacity="0.55"/>
    <ellipse cx="68" cy="26" rx="11" ry="6" fill="#2563eb" opacity="0.55"/>
    <rect x="48" y="26" width="28" height="8" fill="#2563eb" opacity="0.55"/>

    <!-- File on server -->
    <path d="M58 32h10l4 4v12a1.5 1.5 0 0 1-1.5 1.5H58a1.5 1.5 0 0 1-1.5-1.5V33.5A1.5 1.5 0 0 1 58 32z" fill="#3b82f6"/>
    <path d="M68 32v4h4" fill="#2563eb"/>

    <!-- Network link 2 -->
    <path d="M84 38h18" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M98 38h8" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M104 35l5 3-5 3" fill="#22c55e"/>

    <!-- Terminal with curl / wget -->
    <rect x="112" y="24" width="34" height="24" rx="3" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="112" y="24" width="34" height="7" rx="3" fill="#14532d"/>
    <circle cx="117" cy="27.5" r="1.2" fill="#4ade80"/>
    <circle cx="121" cy="27.5" r="1.2" fill="#86efac"/>
    <text x="116" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" fill="#4ade80">$ curl</text>
    <text x="116" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="6.5" fill="#64748b">wget</text>
  </g>

  <line x1="178" y1="18" x2="178" y2="70" stroke="#374151" stroke-width="1"/>

  <text x="194" y="54" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="32" font-weight="600" fill="#f9fafb" letter-spacing="-0.02em">File Share</text>
</svg>
