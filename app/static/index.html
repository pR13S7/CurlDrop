<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drop-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.05); }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xl">
    <h1 class="text-3xl font-bold text-center mb-2">File Share</h1>
    <p class="text-gray-400 text-center mb-8">Upload a file, get a curl-friendly link. Files expire in 24 hours.</p>

    <!-- Upload Section -->
    <div id="upload-section">
      <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-xl p-12 text-center cursor-pointer hover:border-gray-400 transition-colors">
        <svg class="mx-auto mb-4 w-12 h-12 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <p class="text-lg text-gray-300 mb-1">Drop file here or click to browse</p>
        <p class="text-sm text-gray-500">Maximum file size: 200 MB</p>
      </div>
      <input type="file" id="file-input" class="hidden">

      <!-- File Info (shown after selection) -->
      <div id="file-info" class="hidden mt-4 bg-gray-800 rounded-lg p-4">
        <div class="flex items-center justify-between mb-3">
          <span id="file-name" class="text-sm text-gray-300 truncate mr-4"></span>
          <span id="file-size" class="text-sm text-gray-500 whitespace-nowrap"></span>
        </div>
        <div id="progress-container" class="hidden">
          <div class="w-full bg-gray-700 rounded-full h-2 mb-2">
            <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <p id="progress-text" class="text-xs text-gray-500 text-right">0%</p>
        </div>
        <button id="upload-btn" class="w-full mt-3 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 disabled:cursor-not-allowed py-2.5 rounded-lg font-semibold transition-colors">
          Upload
        </button>
      </div>

      <div id="error-msg" class="hidden mt-4 bg-red-900/50 border border-red-700 rounded-lg p-3 text-red-300 text-sm"></div>
    </div>

    <!-- Success Section -->
    <div id="success-section" class="hidden">
      <div class="bg-gray-800 rounded-xl p-6">
        <div class="flex items-center mb-4">
          <svg class="w-6 h-6 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <h2 class="text-xl font-semibold">File uploaded</h2>
        </div>

        <div class="space-y-3 mb-6">
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">File</span>
            <span id="result-filename" class="text-gray-200"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">Size</span>
            <span id="result-size" class="text-gray-200"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">Expires</span>
            <span id="result-expires" class="text-gray-200"></span>
          </div>
        </div>

        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-500 uppercase tracking-wide">Download URL</label>
            <div class="flex mt-1">
              <input id="result-url" readonly class="flex-1 bg-gray-900 border border-gray-700 rounded-l-lg px-3 py-2 text-sm font-mono text-gray-300">
              <button onclick="copyText('result-url')" class="bg-gray-700 hover:bg-gray-600 px-4 rounded-r-lg text-sm transition-colors">Copy</button>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500 uppercase tracking-wide">curl</label>
            <div class="flex mt-1">
              <input id="result-curl" readonly class="flex-1 bg-gray-900 border border-gray-700 rounded-l-lg px-3 py-2 text-sm font-mono text-gray-300">
              <button onclick="copyText('result-curl')" class="bg-gray-700 hover:bg-gray-600 px-4 rounded-r-lg text-sm transition-colors">Copy</button>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500 uppercase tracking-wide">wget</label>
            <div class="flex mt-1">
              <input id="result-wget" readonly class="flex-1 bg-gray-900 border border-gray-700 rounded-l-lg px-3 py-2 text-sm font-mono text-gray-300">
              <button onclick="copyText('result-wget')" class="bg-gray-700 hover:bg-gray-600 px-4 rounded-r-lg text-sm transition-colors">Copy</button>
            </div>
          </div>
        </div>

        <button id="reset-btn" class="w-full mt-6 border border-gray-600 hover:border-gray-400 py-2.5 rounded-lg text-sm transition-colors">
          Upload another file
        </button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
